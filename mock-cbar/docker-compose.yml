# Runs the mock CBAR server in its own container, isolated from other projects.
# Settings come from .env next to this file (see .env.example).
services:
  mock-cbar:
    build: .
    container_name: cibim-mock-cbar
    restart: unless-stopped
    environment:
      PORT: "4000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MOCK_ENFORCE_FREQUENCY: ${MOCK_ENFORCE_FREQUENCY:-false}
    # 127.0.0.1 keeps the port off the internet; nginx proxies to it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-4000}:4000"
    # Caps so the mock can never starve other services on the VPS.
    mem_limit: 128m
    cpus: 0.5
